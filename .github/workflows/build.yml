name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar e testes de unidade
        run: ./gradlew build

      - name: GameTests
        run: ./gradlew runGameTestServer

      - name: GameTests de químicos (com o Mekanism)
        run: ./gradlew runGameTestServerChemicals

      - uses: actions/upload-artifact@v4
        with:
          name: wirelessautomate
          path: build/libs/*.jar
