import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters

plugins {
    id 'java-library'
    id 'idea'
    // Modo legacyforge do ModDevGradle: Forge 47 (Minecraft 1.20.1), com o reobfJar para o jar publicado.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// O jar sai como wirelessautomate-<versão>+mc1.20.1-forge.jar (o publicado é o do reobfJar).
version = "${mod_version}+mc${minecraft_version}-forge"
group = mod_group_id

base {
    archivesName = mod_id
}

// O Minecraft 1.20.1 roda em Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources {
    // Recursos gerados pelo runData.
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    // Repositórios das integrações opcionais (JEI, Mekanism, AE2...) entram aqui quando forem usadas.

    // JEI (integração opcional, ver compat/jei). O modmaven.dev espelha o mesmo grupo.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'com.hollingsworth.ars_nouveau' // Ars Nouveau (Source, ver compat/arsnouveau).
        }
    }
    // Mekanism (químicos, ver compat/mekanism).
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'mekanism'
        }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // Sobe um servidor sem mundo, roda todos os GameTests do mod e encerra.
        // Sai com erro se algum teste falhar, então serve como teste de integração no CI.
        gameTestServer {
            type = 'gameTestServer'
            // Pasta própria, com o mundo apagado antes de cada rodada (tarefa abaixo): dados salvos de
            // rodadas antigas (redes, índice de nós, tickets de chunk) faziam testes falharem.
            gameDirectory = project.file('run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            // Liga as máquinas de teste (gametest/TestMachines): slot de pilha enorme e muitos tanques.
            systemProperty 'wirelessautomate.gameTests', 'true'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}


dependencies {
    // Integrações opcionais (ver docs/especificacao.md, seção Integrações).

    // JEI: só a API na compilação; o JEI completo no classpath das execuções de dev (modRuntimeOnly,
    // remapeado pelo MDG; o modo legacyforge não tem o localRuntime), sem virar dependência do jar. O plugin (compat/jei) só é carregado pelo próprio JEI, quando ele existe.
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    // No 1.20.1 a API comum (mezz.jei.api.*) é um artefato à parte e não vem pela forge-api na compilação.
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"

    // Mekanism: só a API na compilação (IChemicalHandler, ChemicalStack). O mod completo vai para a
    // pasta mods do runClient e da run gameTestServerChemicals (abaixo), não para o classpath: com
    // ele, os GameTests de jogador falso quebram (o Mekanism manda pacotes ao "entrar" o jogador).
    // Tudo que toca na API fica em compat/mekanism e só carrega com o Mekanism presente.
    modCompileOnly "mekanism:Mekanism:${minecraft_version}-${mekanism_version}:api"

    // Ars Nouveau: o jar inteiro só na compilação (não há jar de API), sem as dependências dele. O
    // mod completo, com GeckoLib e Curios, vai para a pasta mods do runClient e da run
    // gameTestServerSource (abaixo). Tudo que toca na API fica em compat/arsnouveau e só carrega
    // com o Ars presente.
    modCompileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_version}") {
        transitive = false
    }

    // GuideME: só na compilação (item/GuideBook); o livro em si é data-driven.
    modCompileOnly "maven.modrinth:guideme:${guideme_version}"

    // Testes de unidade da lógica pura (sem classes do Minecraft).
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// --- Benchmark (docs/benchmark.md) ---
// Sophisticated Storage (o banco de testes da especificação) e o Spark, pelo CurseForge (cursemaven),
// copiados para run/bench/mods só para o run benchServer. Rode com ./scripts/bench.sh. O cliente de
// dev (runClient, também o do e2e) carrega o Sophisticated Storage, o Observable, o Mekanism, o Ars Nouveau,
// o GuideME e o Mouse Tweaks, copiados para run/mods, junto com o JEI; os GameTests não carregam nenhum deles.
repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Os mods do pack (ATM9 To the Sky) vêm do CurseForge, pelos ids de arquivo do gradle.properties.
    exclusiveContent {
        forRepository { maven { name = 'CurseMaven'; url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

configurations {
    benchMods {
        canBeConsumed = false
        transitive = false
    }
    clientMods {
        canBeConsumed = false
        transitive = false
    }
    chemicalTestMods {
        canBeConsumed = false
        transitive = false
    }
    sourceTestMods {
        canBeConsumed = false
        transitive = false
    }
    atmTestMods {
        canBeConsumed = false
        transitive = false
    }
}

// Os jars dos mods do pack (Forge, nomes SRG) vão para as pastas mods das runs. Ainda sem remapear para
// os nomes de dev: provar as runs com mods é a etapa 2 do porte (TODO etapa 2).
dependencies {
    benchMods "curse.maven:sophisticated-storage-619320:${sophisticated_storage_file}"
    benchMods "curse.maven:sophisticated-core-618298:${sophisticated_core_file}"
    benchMods "curse.maven:spark-361579:${spark_file}"
    clientMods "curse.maven:sophisticated-storage-619320:${sophisticated_storage_file}"
    clientMods "curse.maven:sophisticated-core-618298:${sophisticated_core_file}"
    // Observable (perfil de lag por bloco e entidade, desenhado no mundo) e as dependências dele.
    clientMods "curse.maven:observable-509575:${observable_file}"
    clientMods "curse.maven:kotlin-for-forge-351264:${kotlinforforge_file}"
    clientMods "curse.maven:architectury-api-419699:${architectury_file}"
    clientMods "mekanism:Mekanism:${minecraft_version}-${mekanism_version}"
    // GuideME: o livro-guia do mod (data-driven, em assets/wirelessautomate/guides); opcional.
    clientMods "maven.modrinth:guideme:${guideme_version}"
    // Mouse Tweaks: para testar a lista do Baú junto com os arrastos dele nos slots.
    clientMods "curse.maven:mouse-tweaks-60089:${mousetweaks_file}"
    chemicalTestMods "mekanism:Mekanism:${minecraft_version}-${mekanism_version}"
    // Ars Nouveau (Source) e as dependências obrigatórias dele.
    clientMods "com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_version}"
    clientMods "curse.maven:geckolib-388172:${geckolib_file}"
    clientMods "curse.maven:curios-309927:${curios_file}"
    sourceTestMods "com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_version}"
    sourceTestMods "curse.maven:geckolib-388172:${geckolib_file}"
    sourceTestMods "curse.maven:curios-309927:${curios_file}"
    // Allthemodium (tiers Allthemodium, Vibranium e Unobtainium) e All The Tweaks (fragmento de ATM Star).
    clientMods "curse.maven:allthemodium-364466:${allthemodium_file}"
    clientMods "curse.maven:all-the-tweaks-364120:${allthetweaks_file}"
    atmTestMods "curse.maven:allthemodium-364466:${allthemodium_file}"
    atmTestMods "curse.maven:all-the-tweaks-364120:${allthetweaks_file}"
    // O Allthemodium 2.5 exige o All The Ores e o GeckoLib.
    clientMods "curse.maven:alltheores-405593:${alltheores_file}"
    atmTestMods "curse.maven:alltheores-405593:${alltheores_file}"
    atmTestMods "curse.maven:geckolib-388172:${geckolib_file}"
}

// Mods na pasta mods/ do jogo, e não no classpath: o FML só descobre como mod o que está no
// classpath do source set ou na pasta mods.
var prepareBenchMods = tasks.register('prepareBenchMods', Sync) {
    from configurations.benchMods
    into layout.projectDirectory.dir('run/bench/mods')
    // O jar do Logistics Network (benchmark comparativo, All Rights Reserved): o scripts/bench.sh põe e
    // tira, só na máquina local. Nunca vira dependência do build.
    preserve {
        include 'LogisticsNetworks-*.jar'
    }
}

// run/mods do cliente: troca as versões dos mods acima quando mudam e preserva o que o dono
// puser ali à mão.
var prepareClientMods = tasks.register('prepareClientMods', Sync) {
    from configurations.clientMods
    into layout.projectDirectory.dir('run/mods')
    preserve {
        include '**'
        exclude 'sophisticated-*.jar', 'observable-*.jar', 'kotlin-for-forge-*.jar', 'architectury-api-*.jar',
                'Mekanism-*.jar', 'guideme-*.jar', 'ars_nouveau-*.jar', 'geckolib-*.jar', 'curios-*.jar',
                'allthemodium-*.jar', 'all-the-tweaks-*.jar', 'alltheores-*.jar', 'mouse-tweaks-*.jar', 'spark-*.jar'
    }
}

// O Observable publica cada perfil em observable.tas.sh por padrão; com uploadURL vazio ele não
// envia nada. Só cria o arquivo se ele não existir (não sobrescreve o que o dono mudar).
var prepareObservableConfig = tasks.register('prepareObservableConfig') {
    var file = layout.projectDirectory.file('run/config/observable.json').asFile
    outputs.upToDateWhen { file.exists() }
    doLast {
        if (!file.exists()) {
            file.parentFile.mkdirs()
            file.text = '{\n    "uploadURL": ""\n}\n'
        }
    }
}

legacyForge.runs.client.taskBefore prepareClientMods

// GameTests de químicos: um servidor de testes próprio, com o Mekanism na pasta mods, que roda só o
// namespace wirelessautomate_chemicals (gametest/ChemicalGameTests). ./gradlew runGameTestServerChemicals
var prepareChemicalTestMods = tasks.register('prepareChemicalTestMods', Sync) {
    from configurations.chemicalTestMods
    into layout.projectDirectory.dir('run/gametest-chemicals/mods')
}

legacyForge.runs {
    gameTestServerChemicals {
        type = 'gameTestServer'
        gameDirectory = project.file('run/gametest-chemicals')
        systemProperty 'forge.enabledGameTestNamespaces', 'wirelessautomate_chemicals'
        // Liga os tanques de químico de teste (gametest/ChemicalTestTanks).
        systemProperty 'wirelessautomate.chemicalTests', 'true'
        taskBefore prepareChemicalTestMods
    }
}
legacyForge.runs.client.taskBefore prepareObservableConfig

// GameTests de Source: um servidor de testes próprio, com o Ars Nouveau (e GeckoLib e Curios) na
// pasta mods, que roda só o namespace wirelessautomate_source (gametest/SourceGameTests).
// ./gradlew runGameTestServerSource
var prepareSourceTestMods = tasks.register('prepareSourceTestMods', Sync) {
    from configurations.sourceTestMods
    into layout.projectDirectory.dir('run/gametest-source/mods')
}

legacyForge.runs {
    gameTestServerSource {
        type = 'gameTestServer'
        gameDirectory = project.file('run/gametest-source')
        systemProperty 'forge.enabledGameTestNamespaces', 'wirelessautomate_source'
        systemProperty 'wirelessautomate.sourceTests', 'true'
        taskBefore prepareSourceTestMods
    }
}

// GameTests dos tiers do ATM: um servidor de testes próprio, com o Allthemodium e o All The Tweaks na
// pasta mods, que roda só o namespace wirelessautomate_atm (gametest/AtmGameTests).
// ./gradlew runGameTestServerAllthemodium
var prepareAtmTestMods = tasks.register('prepareAtmTestMods', Sync) {
    from configurations.atmTestMods
    into layout.projectDirectory.dir('run/gametest-atm/mods')
}

legacyForge.runs {
    gameTestServerAllthemodium {
        type = 'gameTestServer'
        gameDirectory = project.file('run/gametest-atm')
        systemProperty 'forge.enabledGameTestNamespaces', 'wirelessautomate_atm'
        taskBefore prepareAtmTestMods
    }
}

legacyForge.runs {
    // Servidor dedicado de benchmark num diretório próprio (run/bench), com mundo plano preparado
    // pelo scripts/bench.sh. A propriedade wirelessautomate.bench liga as máquinas de teste de
    // fluido e energia (bench/BenchCapabilities.java).
    benchServer {
        server()
        gameDirectory = project.file('run/bench')
        programArgument '--nogui'
        jvmArgument '-Xmx2G'
        systemProperty 'wirelessautomate.bench', 'true'
        logLevel = org.slf4j.event.Level.INFO
        taskBefore prepareBenchMods
        // ./gradlew runBenchServer -PbenchJfr=<arquivo.jfr>: grava um perfil do Java Flight Recorder
        // (local, sem enviar nada), para ver onde o tempo do mod vai (jfr print / JDK Mission Control).
        if (project.hasProperty('benchJfr')) {
            jvmArgument "-XX:StartFlightRecording=filename=${project.property('benchJfr')},settings=profile,method-profiling=max"
        }
    }
}

// Preenche os ${...} do META-INF/mods.toml com os valores do gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Durante o porte o compilador tem de mostrar todos os erros (scripts/porte/erros.sh), não só 100.
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// GameTests sempre num mundo novo (ver a run gameTestServer).
def gameTestWorld = layout.projectDirectory.dir('run/gametest/world').asFile
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        gameTestWorld.deleteDir()
    }
}
def chemicalTestWorld = layout.projectDirectory.dir('run/gametest-chemicals/world').asFile
tasks.matching { it.name == 'runGameTestServerChemicals' }.configureEach {
    doFirst {
        chemicalTestWorld.deleteDir()
    }
}

def sourceTestWorld = layout.projectDirectory.dir('run/gametest-source/world').asFile
tasks.matching { it.name == 'runGameTestServerSource' }.configureEach {
    doFirst {
        sourceTestWorld.deleteDir()
    }
}

def atmTestWorld = layout.projectDirectory.dir('run/gametest-atm/world').asFile
tasks.matching { it.name == 'runGameTestServerAllthemodium' }.configureEach {
    doFirst {
        atmTestWorld.deleteDir()
    }
}

// Cada servidor ou cliente de dev usa ~3 GB, e o org.gradle.parallel poderia rodá-los juntos numa mesma
// invocação. Este serviço tem uma vaga só: as tarefas que sobem o jogo rodam uma de cada vez.
abstract class OneGame implements BuildService<BuildServiceParameters.None> {}
def oneGame = gradle.sharedServices.registerIfAbsent('oneGame', OneGame) { maxParallelUsages = 1 }
tasks.matching { it.name in ['runGameTestServer', 'runGameTestServerChemicals', 'runGameTestServerSource',
        'runGameTestServerAllthemodium', 'runClient', 'runBenchServer'] }
        .configureEach { usesService(oneGame) }

// O servidor de GameTests que trava ao carregar (um mod que não sobe) sai sem erro para o Gradle.
// Por isso o build confere no log que a rodada chegou ao fim com todos os testes passando.
[runGameTestServer: 'run/gametest', runGameTestServerChemicals: 'run/gametest-chemicals', runGameTestServerSource: 'run/gametest-source',
 runGameTestServerAllthemodium: 'run/gametest-atm'].each { name, dir ->
    def log = layout.projectDirectory.file("${dir}/logs/latest.log").asFile
    tasks.matching { it.name == name }.configureEach {
        doFirst {
            log.delete()
        }
        doLast {
            if (!log.exists() || !log.getText('UTF-8').contains('required tests passed')) {
                throw new GradleException("${name}: os GameTests não chegaram ao fim com sucesso; veja ${log}")
            }
        }
    }
}

// --- Porte 1.20.1 (temporário, até a tarefa 10) ---
// Com -Pporte.soPuras, o source set main compila só a lógica pura testada em src/test/java e as
// dependências puras dela, para o JUnit rodar enquanto o resto do mod ainda não compila no 1.20.1:
// ./gradlew test -Pporte.soPuras
if (project.hasProperty('porte.soPuras')) {
    def base = 'io/github/matheusanbs/wirelessautomate/'
    def puras = [
            'bench/LnChannelPlan', 'bench/Samples',
            'block/TierLadder',
            'client/CardGrid', 'client/EnchantSearch', 'client/RateFormat', 'client/ResizeHandle',
            'client/TabLayout', 'client/WheelLayout',
            'filter/StockLimit',
            'linker/LinkerBox', 'linker/LinkerTabs',
            'network/Backoff', 'network/EnergySplit', 'network/RateLimiter', 'network/RateMath',
            'network/ReachBox', 'network/ResourceType', 'network/RoundRobinOrder', 'network/SourceCursor',
            'network/TickBudget',
            'preset/PasteTypes',
            'storage/StorageMath', 'storage/StorageShapes',
            // Tarefa 4: o PasteMode usa o LinkerMode (com o StreamCodec da camada net/) e o ScalarStore
            // implementa o BulkEnergy e o BulkSource (a Capability do Forge vem do StorageCapabilities, que só
            // inicializa fora do JUnit); todos compilam no 1.20.1.
            'preset/PasteMode', 'linker/LinkerMode',
            'net/StreamCodec', 'net/StreamDecoder', 'net/StreamEncoder', 'net/StreamMemberEncoder',
            'net/NeoForgeStreamCodecs', 'net/RegistryFriendlyByteBuf',
            'storage/ScalarStore', 'storage/BulkEnergy', 'storage/BulkSource', 'storage/StorageCapabilities',
            'storage/BulkItems', 'storage/BulkFluids',
    ]
    def testesFora = []
    sourceSets.main.java { include puras.collect { base + it + '.java' } }
    sourceSets.test.java { exclude testesFora.collect { base + it + '.java' } }
}
