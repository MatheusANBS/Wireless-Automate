plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// O Minecraft 1.21.1 roda em Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    // Recursos gerados pelo runData.
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    // Repositórios das integrações opcionais (JEI, Mekanism, AE2...) entram aqui quando forem usadas.

    // JEI (integração opcional, ver compat/jei). O modmaven.dev espelha o mesmo grupo.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config' // biblioteca de config que o JEI 19.56+ usa
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Sobe um servidor sem mundo, roda todos os GameTests do mod e encerra.
        // Sai com erro se algum teste falhar, então serve como teste de integração no CI.
        gameTestServer {
            type = 'gameTestServer'
            // Pasta própria, com o mundo apagado antes de cada rodada (tarefa abaixo): dados salvos de
            // rodadas antigas (redes, índice de nós, tickets de chunk) faziam testes falharem.
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependências só para testar em dev, sem virar dependência publicada do mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Integrações opcionais (ver docs/especificacao.md, seção Integrações).

    // JEI: só a API na compilação; o JEI completo só nas execuções de dev (runClient), sem virar
    // dependência do jar. O plugin (compat/jei) só é carregado pelo próprio JEI, quando ele existe.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Testes de unidade da lógica pura (sem classes do Minecraft).
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// --- Benchmark (docs/benchmark.md) ---
// Sophisticated Storage (o banco de testes da especificação) e o Spark, pelo Maven do Modrinth,
// copiados para run/bench/mods só para o run benchServer. Rode com ./scripts/bench.sh. O cliente de
// dev (runClient, também o do e2e) carrega o Sophisticated Storage e o Observable, copiados para
// run/mods, junto com o JEI; os GameTests não carregam nenhum mod do Modrinth.
repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    benchMods {
        canBeConsumed = false
        transitive = false
    }
    clientMods {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    benchMods 'maven.modrinth:sophisticated-storage:1.21.1-1.6.2.2159'
    benchMods 'maven.modrinth:sophisticated-core:1.21.1-1.5.7.2381'
    benchMods 'maven.modrinth:spark:1.10.124-neoforge-1.21.1'
    clientMods 'maven.modrinth:sophisticated-storage:1.21.1-1.6.2.2159'
    clientMods 'maven.modrinth:sophisticated-core:1.21.1-1.5.7.2381'
    // Observable (perfil de lag por bloco e entidade, desenhado no mundo) e as dependências dele.
    clientMods 'maven.modrinth:observable:5.4.4+neoforge'
    clientMods 'maven.modrinth:kotlin-for-forge:5.12.0'
    clientMods 'maven.modrinth:architectury-api:13.0.11+neoforge'
}

// Mods na pasta mods/ do jogo, e não no classpath: o FML só descobre como mod o que está no
// classpath do source set ou na pasta mods.
var prepareBenchMods = tasks.register('prepareBenchMods', Sync) {
    from configurations.benchMods
    into layout.projectDirectory.dir('run/bench/mods')
}

// run/mods do cliente: troca as versões dos mods acima quando mudam e preserva o que o dono
// puser ali à mão.
var prepareClientMods = tasks.register('prepareClientMods', Sync) {
    from configurations.clientMods
    into layout.projectDirectory.dir('run/mods')
    preserve {
        include '**'
        exclude 'sophisticated-*.jar', 'observable-*.jar', 'kotlin-for-forge-*.jar', 'architectury-api-*.jar'
    }
}

neoForge.runs.client.taskBefore prepareClientMods

neoForge.runs {
    // Servidor dedicado de benchmark num diretório próprio (run/bench), com mundo plano preparado
    // pelo scripts/bench.sh. A propriedade wirelessautomate.bench liga as máquinas de teste de
    // fluido e energia (bench/BenchCapabilities.java).
    benchServer {
        server()
        gameDirectory = project.file('run/bench')
        programArgument '--nogui'
        jvmArgument '-Xmx2G'
        systemProperty 'wirelessautomate.bench', 'true'
        logLevel = org.slf4j.event.Level.INFO
        taskBefore prepareBenchMods
        // ./gradlew runBenchServer -PbenchJfr=<arquivo.jfr>: grava um perfil do Java Flight Recorder
        // (local, sem enviar nada), para ver onde o tempo do mod vai (jfr print / JDK Mission Control).
        if (project.hasProperty('benchJfr')) {
            jvmArgument "-XX:StartFlightRecording=filename=${project.property('benchJfr')},settings=profile,method-profiling=max"
        }
    }
}

// Preenche os ${...} do neoforge.mods.toml com os valores do gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// GameTests sempre num mundo novo (ver a run gameTestServer).
def gameTestWorld = layout.projectDirectory.dir('run/gametest/world').asFile
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        gameTestWorld.deleteDir()
    }
}
