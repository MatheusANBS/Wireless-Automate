## Integrações opcionais
# JEI para 1.21.1 em https://maven.blamejared.com/mezz/jei/jei-1.21.1-neoforge/
jei_version=19.57.0.451
# Mekanism para 1.21.1 em https://modmaven.dev/mekanism/Mekanism/ (químicos unificados da 10.7)
mekanism_version=10.7.19.85
# Ars Nouveau para 1.21.1 em https://maven.blamejared.com/com/hollingsworth/ars_nouveau/ars_nouveau-1.21.1/
# (a API de Source é a mesma de 5.2.0.750 a 5.13.3.1423; o mods.toml pede [5.2,))
ars_version=5.13.3.1423
# Dependências do Ars, só nas runs de dev (Maven do Modrinth)
# 4.9.2 existe em 3 loaders no Modrinth; o id da versão escolhe a de NeoForge (geckolib-neoforge-1.21.1-4.9.2)
geckolib_version=tPkJmim6
curios_version=9.5.1+1.21.1
# Allthemodium e All The Tweaks (tiers do ATM): só nas runs de dev, pelo CurseForge (https://cursemaven.com),
# no formato <projeto>:<id do arquivo>. Nenhum código usa a API deles: só ids e tags nas receitas.
# allthemodium-3.2.0_mc_1.21.1 (pede o GeckoLib) e allthetweaks-1.21.1-2.12.1
allthemodium_file=9083119
allthetweaks_file=9047119

