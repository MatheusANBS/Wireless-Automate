# Memória do Gradle. A decompilação do Minecraft pede pelo menos 3 GB.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Ambiente
# Versões em https://projects.neoforged.net/neoforged/neoforge e https://parchmentmc.org/docs/getting-started
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod
mod_id=wirelessautomate
