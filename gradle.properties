# Memória do Gradle. A decompilação do Minecraft pede pelo menos 3 GB.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Ambiente
# Ramo mc/1.20.1-forge (docs/portes.md). Forge em https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
# e Parchment em https://parchmentmc.org/docs/getting-started
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
# Versão do Forge do ATM9 To the Sky 1.1.9; ela é também o mínimo exigido no mods.toml.
forge_version=47.4.10
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

