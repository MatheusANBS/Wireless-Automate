# Memória do Gradle. A decompilação do Minecraft pede pelo menos 3 GB.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Ambiente
# Versões em https://projects.neoforged.net/neoforged/neoforge e https://parchmentmc.org/docs/getting-started
