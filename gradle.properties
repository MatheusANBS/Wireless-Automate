## Integrações opcionais
# JEI para 1.21.1 em https://maven.blamejared.com/mezz/jei/jei-1.21.1-neoforge/
jei_version=19.57.0.451
# Mekanism para 1.21.1 em https://modmaven.dev/mekanism/Mekanism/ (químicos unificados da 10.7)
mekanism_version=10.7.19.85
# Ars Nouveau para 1.21.1 em https://maven.blamejared.com/com/hollingsworth/ars_nouveau/ars_nouveau-1.21.1/
# (a API de Source é a mesma de 5.2.0.750 a 5.13.3.1423; o mods.toml pede [5.2,))
ars_version=5.13.3.1423
# Dependências do Ars, só nas runs de dev (Maven do Modrinth)
# 4.9.2 existe em 3 loaders no Modrinth; o id da versão escolhe a de NeoForge (geckolib-neoforge-1.21.1-4.9.2)
geckolib_version=tPkJmim6
curios_version=9.5.1+1.21.1
# Allthemodium e All The Tweaks (tiers do ATM): só nas runs de dev, pelo CurseForge (https://cursemaven.com),
# no formato <projeto>:<id do arquivo>. Nenhum código usa a API deles: só ids e tags nas receitas.
# allthemodium-3.2.0_mc_1.21.1 (pede o GeckoLib) e allthetweaks-1.21.1-2.12.1
allthemodium_file=9083119
allthetweaks_file=9047119
# Mods das receitas de cascata dos Corações do Ressonador, só no runClient (as mesmas versões do ATM10):
# applied-energistics-2 19.2.17, megacells 4.11.0, draconic-evolution 1.21.1-3.1.4.633, brandonscore 1.21.1-3.2.1.309,
# codechickenlib 1.21.1-4.6.1.529 e modern-industrialization 2.5.8 (o GrandPower vem dentro do jar dele)
ae2_file=7027323
megacells_file=7952621
draconicevolution_file=8797042
brandonscore_file=7130990
codechickenlib_file=8491811
modernindustrialization_file=8863289
# AllTheCompressed 4.4.0 (blocos 1x a 9x por receitas de mesa), só no runClient, para testar o upgrade de
# Compactação do Baú; sem dependências
allthecompressed_file=7361502
# Occultism 1.224.4 (os mineradores do Dimensional Mineshaft, como a lâmpada do Ancient Eldritch) e as dependências
# obrigatórias dele que ainda não estão no runClient: Modonomicon 1.120.4 e SmartBrainLib 1.16.11 (GeckoLib e Curios já estão)
occultism_file=8745224
modonomicon_file=8532346
smartbrainlib_file=7055149
# Just Dire Things 1.5.7, só no runClient (a mesma versão do Infinity Legacy II); sem dependências obrigatórias
