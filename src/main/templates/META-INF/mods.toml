modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MatheusANBS/Wireless-Automate/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# A versão do Forge do gradle.properties é a mínima exigida (a do ATM9 To the Sky).
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Integrações opcionais: carregam só se o mod estiver presente.
# Mekanism 10.4: os quatro químicos (gás, infusão, pigmento e slurry).
[[dependencies.${mod_id}]]
    modId="mekanism"
    mandatory=false
    versionRange="[10.4,)"
    ordering="AFTER"
    side="BOTH"

# Ars Nouveau: a aba Source.
[[dependencies.${mod_id}]]
    modId="ars_nouveau"
    mandatory=false
    versionRange="[4.12,)"
    ordering="NONE"
    side="BOTH"

# Allthemodium: os tiers Allthemodium, Vibranium e Unobtainium (só ids e tags nas receitas, sem API).
[[dependencies.${mod_id}]]
    modId="allthemodium"
    mandatory=false
    versionRange="[2,)"
    ordering="NONE"
    side="BOTH"

# GuideME mostra o livro-guia (data-driven, sem código: assets/wirelessautomate/guideme_guides e guides).
[[dependencies.${mod_id}]]
    modId="guideme"
    mandatory=false
    versionRange="[20.1,)"
    ordering="NONE"
    side="BOTH"

# JEI 15 é a linha do 1.20.1.
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15,)"
    ordering="NONE"
    side="BOTH"
