modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MatheusANBS/Wireless-Automate/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Integrações opcionais: carregam só se o mod estiver presente.
[[dependencies.${mod_id}]]
    modId="mekanism"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# JEI 19 é a linha do 1.21.1. Arrastar funciona em toda ela; Shift + clique na lista pede 19.28+.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="BOTH"
